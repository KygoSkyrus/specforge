apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: specforge-ingress
  namespace: specforge
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "60s"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://specforge.app"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - specforge.app
        - www.specforge.app
        - api.specforge.app
      secretName: specforge-tls-cert
  rules:
    - host: specforge.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: specforge-web
                port:
                  number: 3000
    - host: www.specforge.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: specforge-web
                port:
                  number: 3000
    - host: api.specforge.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: specforge-api
                port:
                  number: 3001

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: specforge-cert
  namespace: specforge
spec:
  secretName: specforge-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - specforge.app
    - www.specforge.app
    - api.specforge.app
  duration: 2160h # 90d
  renewBefore: 360h # 15d

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@specforge.app
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
