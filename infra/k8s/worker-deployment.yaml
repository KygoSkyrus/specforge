apiVersion: apps/v1
kind: Deployment
metadata:
  name: specforge-worker
  namespace: specforge
  labels:
    app: specforge
    component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: specforge
      component: worker
  template:
    metadata:
      labels:
        app: specforge
        component: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/specforge/worker:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: specforge-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: specforge-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: specforge-secrets
                  key: redis-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: specforge-secrets
                  key: openai-api-key
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: specforge-worker-hpa
  namespace: specforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: specforge-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
